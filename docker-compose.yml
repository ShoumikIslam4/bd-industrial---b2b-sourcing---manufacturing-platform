version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bd_industrial_platform
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - VITE_FIREBASE_PROJECT_ID=bd-industrial-prod
      - VITE_PLATFORM_CURRENCY=BDT
      - VITE_DEFAULT_LANGUAGE=en
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
